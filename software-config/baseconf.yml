---
- name: Basic system config and tools
  hosts: hostlist
  vars_files:
    - ./adminvars.yml
  tasks:
    - name: Enable MS repo
      ansible.builtin.yum:
        name:
          - https://packages.microsoft.com/rhel/8/prod/Packages/p/packages-microsoft-prod.rpm
        state: present
      when: ansible_distribution == "Rocky"
    - name: Install basic system tools (Rocky)
      ansible.builtin.yum:
        name:
          - lsof
          - dstat
          - nmap
          - nmap-ncat
          - realmd
          - sssd-ad
          - oddjob
          - oddjob-mkhomedir
          - adcli
          - samba-common-tools
          - samba-client
          - krb5-workstation
          - cifs-utils
          - autofs
          - xorg-x11-fonts-Type1
          - urw-base35-fonts
          - perl-Digest-MD5
          # - urw-base35-fonts-20170801-10
          # - urw-base35-standard-symbols-ps-fonts-20170801-10
          # - texlive-xetex
          # - texlive-xltxtra
          - git
        state: present
      when: ansible_facts['os_family'] == "RedHat"
    - name: Install MS sql drivers
      environment:
        ACCEPT_EULA: "y"
      ansible.builtin.yum:
        name:
          - msodbcsql17
          - mssql-tools
        state: present
      when: ansible_facts['os_family'] == "RedHat"
    - name: Install basic system tools (Ubuntu)
      ansible.builtin.apt:
        name:
          - samba-client
          - realmd
          - libnss-sss
          - libpam-sss
          - sssd
          - sssd-tools
          - adcli
          - samba-common-bin
          - oddjob
          - oddjob-mkhomedir
          - packagekit
          - autofs
          - libuser
          - texlive-latex-recommended
          - texlive-fonts-recommended
          - texlive-xetex
          - pandoc
      when: ansible_distribution == "Ubuntu"
    - name: Register with domain
      ansible.builtin.command:
        cmd: realm join -U '{{ admin_user }}'  '{{ ad_domain }}'
        stdin: "{{ password }}"
        creates: /etc/krb5.keytab
      no_log: true # Do not expose password in logs!!!!
    - name: Set adhome root dir
      community.general.ini_file:
        section: domain/ad.uit.no
        path: /etc/sssd/sssd.conf
        option: fallback_homedir
        value: /azhome/%u@%d
        mode: "0600"
      notify:
        - Restart sssd
    - name: Limit sssd group lookup
      community.general.ini_file:
        section: domain/ad.uit.no
        path: /etc/sssd/sssd.conf
        option: ldap_use_tokengroups
        value: false
        mode: "0600"
      notify:
        - Restart sssd
    - name: Limit sssd ad group lookup to domain users
      community.general.ini_file:
        section: domain/ad.uit.no
        path: /etc/sssd/sssd.conf
        option: ldap_group_search_base
        value: DC=ad,DC=uit,DC=no?sub?(cn=domain users)
        mode: "0600"
        state: absent
      notify:
        - Restart sssd
    - name: Set kerberos ticket timeout
      community.general.ini_file:
        section: domain/ad.uit.no
        path: /etc/sssd/sssd.conf
        option: krb5_renewable_lifetime
        value: 7d
        mode: "0600"
      notify:
        - Restart sssd
    - name: Set kerberos ticket renew interval
      community.general.ini_file:
        section: domain/ad.uit.no
        path: /etc/sssd/sssd.conf
        option: krb5_renew_interval
        value: 500
        mode: "0600"
      notify:
        - Restart sssd
    - name: Create autofs config for home dirs
      ansible.builtin.copy:
        dest: /etc/auto.master.d/azhome.autofs
        content: |
          /azhome program /etc/auto.adhome --timeout=3600
        mode: "0644"
      notify:
        - Restart autofs
    - name: Create ad mount command
      ansible.builtin.copy:
        dest: /etc/auto.adhome
        src: auto.adhome
        mode: +rx
    - name: Create home share configuration
      ansible.builtin.copy:
        dest: /etc/homeshares
        src: homeshares
        mode: "0644"
    - name: Mount credentials
      ansible.builtin.copy:
        dest: /etc/smbhome.conf
        src: smbhome.conf
        mode: "0600"
    - name: Start autofs system service
      ansible.builtin.systemd:
        name: autofs
        enabled: true
        daemon_reload: true
        state: started
  handlers:
    - name: Restart sssd
      ansible.builtin.systemd:
        name: sssd
        state: restarted
    - name: Restart autofs
      ansible.builtin.systemd:
        name: autofs
        state: restarted
